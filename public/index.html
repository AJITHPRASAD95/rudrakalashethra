<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Nritya Academy — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="assets/css/base.css"/>
<link rel="stylesheet" href="assets/css/components.css"/>
</head>
<body>
<div id="app">

  <!-- ── LOGIN ─────────────────────────────────────────────── -->
  <div id="login-screen" class="login-screen">
    <div class="login-bg">
      <div class="login-orb login-orb-1"></div>
      <div class="login-orb login-orb-2"></div>
      <div class="login-orb login-orb-3"></div>
    </div>
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-mark">
          <svg viewBox="0 0 40 40" fill="none" width="40" height="40">
            <polygon points="20,2 38,32 2,32" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
            <polygon points="20,10 30,28 10,28" fill="currentColor" opacity=".25"/>
          </svg>
        </div>
        <div>
          <h1 class="brand-name">Nritya Academy</h1>
          <p class="brand-sub">Administration Portal</p>
        </div>
      </div>
      <form id="login-form" autocomplete="off">
        <div class="field">
          <label class="field-label">Email address</label>
          <div class="field-wrap">
            <span class="field-icon">
              <svg viewBox="0 0 20 20" fill="none" width="16" height="16"><path d="M2.5 5.5L10 11l7.5-5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><rect x="2" y="4" width="16" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/></svg>
            </span>
            <input type="email" id="login-email" class="field-input" placeholder="admin@nritya.com" required/>
          </div>
        </div>
        <div class="field">
          <label class="field-label">Password</label>
          <div class="field-wrap">
            <span class="field-icon">
              <svg viewBox="0 0 20 20" fill="none" width="16" height="16"><rect x="4" y="9" width="12" height="9" rx="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M7 9V6a3 3 0 016 0v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </span>
            <input type="password" id="login-password" class="field-input" placeholder="••••••••" required/>
          </div>
        </div>
        <div id="login-error" class="login-error" style="display:none"></div>
        <button type="submit" class="btn-login" id="login-btn">
          <span id="login-btn-text">Sign in</span>
          <svg id="login-spinner" class="btn-spinner" style="display:none" viewBox="0 0 24 24" fill="none" width="18" height="18"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" stroke-dasharray="56" stroke-dashoffset="14" stroke-linecap="round"/></svg>
        </button>
      </form>
      <p class="login-hint">Demo: admin@nritya.com / Admin@1234</p>
    </div>
  </div>

  <!-- ── APP SHELL ──────────────────────────────────────────── -->
  <div id="main-shell" class="shell" style="display:none">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark sm">
          <svg viewBox="0 0 40 40" fill="none" width="28" height="28">
            <polygon points="20,2 38,32 2,32" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
            <polygon points="20,10 30,28 10,28" fill="currentColor" opacity=".3"/>
          </svg>
        </div>
        <div class="sidebar-brand-text">
          <span class="sidebar-name">Nritya</span>
          <span class="sidebar-role" id="sidebar-role-tag">Admin</span>
        </div>
        <button class="sidebar-close-btn" id="sidebar-close">
          <svg viewBox="0 0 20 20" fill="none" width="18" height="18"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="sidebar-section-label">Main</div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>

      <div class="sidebar-spacer"></div>

      <div class="sidebar-user" id="sidebar-user">
        <div class="sidebar-avatar" id="sidebar-avatar">A</div>
        <div class="sidebar-user-info">
          <span class="sidebar-user-name" id="sidebar-user-name">Admin</span>
          <span class="sidebar-user-email" id="sidebar-user-email">—</span>
        </div>
        <button class="btn-logout-icon" id="btn-logout" title="Sign out">
          <svg viewBox="0 0 20 20" fill="none" width="16" height="16"><path d="M13 3h3a1 1 0 011 1v12a1 1 0 01-1 1h-3M8 7l-3 3 3 3M5 10h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </aside>

    <!-- Main -->
    <div class="main-area">
      <header class="topbar" id="topbar">
        <button class="btn-hamburger" id="btn-menu">
          <span></span><span></span><span></span>
        </button>
        <div class="topbar-breadcrumb">
          <span class="topbar-app">Nritya Academy</span>
          <svg viewBox="0 0 16 16" fill="none" width="12" height="12"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span id="page-title" class="topbar-page">Dashboard</span>
        </div>
        <div class="topbar-actions">
          <div class="topbar-badge" id="topbar-role-badge">Super Admin</div>
        </div>
      </header>

      <main id="page-content" class="page-content"></main>
    </div>

    <!-- Mobile overlay -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
  </div>
</div>

<div class="toast-stack" id="toast-stack"></div>

<script src="assets/js/core/api.js"></script>
<script src="assets/js/core/store.js"></script>
<script src="assets/js/core/router.js"></script>
<script src="assets/js/components/table.js"></script>
<script src="assets/js/components/modal.js"></script>
<script src="assets/js/components/toast.js"></script>
<script src="assets/js/pages/dashboard.js"></script>
<script src="assets/js/pages/branches.js"></script>
<script src="assets/js/pages/students.js"></script>
<script src="assets/js/pages/classes.js"></script>
<script src="assets/js/pages/payments.js"></script>
<script src="assets/js/pages/attendance.js"></script>
<script src="assets/js/pages/fees.js"></script>
<script src="assets/js/pages/content.js"></script>
<script src="assets/js/pages/mudras.js"></script>
<script src="assets/js/pages/theory.js"></script>
<script src="assets/js/pages/quizzes.js"></script>
<script src="assets/js/pages/learn-dashboard.js"></script>
<script src="assets/js/pages/learn-attendance.js"></script>
<script src="assets/js/pages/learn-mudras.js"></script>
<script src="assets/js/pages/learn-theory.js"></script>
<script src="assets/js/pages/learn-videos.js"></script>
<script src="assets/js/pages/learn-quizzes.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
